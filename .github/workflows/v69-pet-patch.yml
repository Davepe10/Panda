name: V70 Pet Migration
on:
  push:
    branches:
      - responsive-unified-v69
    paths:
      - scripts/apply-v70.mjs
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: responsive-unified-v69
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-v70.mjs
      - run: |
          git config user.name "Pandalandia V70"
          git config user.email "actions@users.noreply.github.com"
          git add components/world/Pet3D.tsx
          git diff --cached --check
          git commit -m "fix: anchor Mia accessories to head and body [v70]"
          git push origin HEAD:responsive-unified-v69
