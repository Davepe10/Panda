name: V70 Final Mobile UI

on:
  push:
    branches: [responsive-unified-v69]
    paths:
      - '.github/workflows/v69-pet-patch.yml'

permissions:
  contents: write

jobs:
  finalize-v70:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: responsive-unified-v69
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final UI, cache and Mia accessory architecture
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs')
          function replaceOne(s,from,to,label){
            if(!s.includes(from)) throw new Error(`Missing patch target: ${label}`)
            return s.replace(from,to)
          }

          // 1) Mia: keep fixed paws, and make standalone head accessories follow the real head group.
          const petPath='components/world/Pet3D.tsx'
          let pet=fs.readFileSync(petPath,'utf8')
          pet=replaceOne(pet,
            "function PremiumCocker({mood='happy',behavior='idle',behaviorNonce=0,onInteract}:{mood?:Mood;behavior?:PetBehavior;behaviorNonce?:number;onInteract?:()=>void}){",
            "function PremiumCocker({mood='happy',behavior='idle',behaviorNonce=0,items=[],onInteract}:{mood?:Mood;behavior?:PetBehavior;behaviorNonce?:number;items?:string[];onInteract?:()=>void}){",
            'PremiumCocker items prop')

          pet=replaceOne(pet,
            "   <Nose position={[0,-.02,.72]} scale={.90}/><Mouth mood={mood} z={.73}/><Blush x={-.34} z={.58}/><Blush x={.34} z={.58}/>\n  </group>",
            "   <Nose position={[0,-.02,.72]} scale={.90}/><Mouth mood={mood} z={.73}/><Blush x={-.34} z={.58}/><Blush x={.34} z={.58}/>\n   <Wearables items={items} behavior={behavior} anchor=\"head\"/>\n  </group>",
            'head wearable mount')

          pet=replaceOne(pet,
            "function Wearables({items=[],behavior='idle'}:{items?:string[];behavior?:PetBehavior}){\n const has=(k:string)=>items.includes(k)",
            "const HEAD_WEARABLE_IDS=new Set(['bow_red','cap','flower_crown','gold_crown','diamond_crown','round_glasses','heart_glasses'])\nfunction Wearables({items=[],behavior='idle',anchor='body'}:{items?:string[];behavior?:PetBehavior;anchor?:'head'|'body'}){\n const mountedItems=items.filter(id=>anchor==='head'?HEAD_WEARABLE_IDS.has(id):!HEAD_WEARABLE_IDS.has(id))\n const has=(k:string)=>mountedItems.includes(k)",
            'wearable anchor registry')

          const headPositions=[
            ["position={[0,.84,.22]}","position={[0,.34,-.20]}"],
            ["position={[0,.90,.11]}","position={[0,.40,-.31]}"],
            ["position={[0,.91,.13]}","position={[0,.41,-.29]}"],
            ["position={[0,1.04,.10]}","position={[0,.54,-.32]}"],
            ["position={[0,1.06,.10]}","position={[0,.56,-.32]}"],
            ["position={[0,.62,.65]}","position={[0,.12,.23]}"],
            ["position={[0,.62,.67]}","position={[0,.12,.25]}"]
          ]
          for(const [a,b] of headPositions){ if(pet.includes(a)) pet=pet.replace(a,b) }

          pet=replaceOne(pet,
            "function ProceduralPet({type,mood,behavior='idle',behaviorNonce=0,onInteract}:{type:PetType;mood:Mood;behavior?:PetBehavior;behaviorNonce?:number;onInteract?:()=>void}){\n return type==='panda'?<Panda mood={mood}/>:type==='shiba'?<Shiba mood={mood}/>:type==='capybara'?<Capybara mood={mood}/>:<PremiumCocker mood={mood} behavior={behavior} behaviorNonce={behaviorNonce} onInteract={onInteract}/>\n}",
            "function ProceduralPet({type,mood,behavior='idle',behaviorNonce=0,items=[],onInteract}:{type:PetType;mood:Mood;behavior?:PetBehavior;behaviorNonce?:number;items?:string[];onInteract?:()=>void}){\n return type==='panda'?<Panda mood={mood}/>:type==='shiba'?<Shiba mood={mood}/>:type==='capybara'?<Capybara mood={mood}/>:<PremiumCocker mood={mood} behavior={behavior} behaviorNonce={behaviorNonce} items={items} onInteract={onInteract}/>\n}",
            'ProceduralPet items')

          pet=replaceOne(pet,
            "function HighFidelityPet({type,mood,behavior='idle',behaviorNonce=0,onInteract}:{type:PetType;mood:Mood;behavior?:PetBehavior;behaviorNonce?:number;onInteract?:()=>void}){\n if(type==='cocker')return <PremiumCocker mood={mood} behavior={behavior} behaviorNonce={behaviorNonce} onInteract={onInteract}/>",
            "function HighFidelityPet({type,mood,behavior='idle',behaviorNonce=0,items=[],onInteract}:{type:PetType;mood:Mood;behavior?:PetBehavior;behaviorNonce?:number;items?:string[];onInteract?:()=>void}){\n if(type==='cocker')return <PremiumCocker mood={mood} behavior={behavior} behaviorNonce={behaviorNonce} items={items} onInteract={onInteract}/>",
            'HighFidelityPet items')
          pet=pet.replace("const fallback=<ProceduralPet type={type} mood={mood} behavior={behavior} behaviorNonce={behaviorNonce} onInteract={onInteract}/>","const fallback=<ProceduralPet type={type} mood={mood} behavior={behavior} behaviorNonce={behaviorNonce} items={items} onInteract={onInteract}/>")
          pet=replaceOne(pet,
            "return <group ref={root}><HighFidelityPet type={type} mood={mood} behavior={behavior} behaviorNonce={behaviorNonce} onInteract={interactive?onInteract:undefined}/><Wearables items={items} behavior={behavior}/><PetStatusEffects mood={mood}/></group>",
            "return <group ref={root}><HighFidelityPet type={type} mood={mood} behavior={behavior} behaviorNonce={behaviorNonce} items={items} onInteract={interactive?onInteract:undefined}/><Wearables items={items} behavior={behavior} anchor=\"body\"/><PetStatusEffects mood={mood}/></group>",
            'PetModel anchored wearables')
          fs.writeFileSync(petPath,pet)

          // 2) Final mobile contract: eliminate hidden desktop widths, enforce contrast, native-like density.
          const cssPath='app/responsive-v69.css'
          let css=fs.readFileSync(cssPath,'utf8')
          const v70=`

/* V70 — screenshot-verified mobile contract. No horizontal clipping, readable text, app-like density. */
