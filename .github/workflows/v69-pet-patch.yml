`
          css += v70
          fs.writeFileSync(cssPath,css)

          // 3) Service worker: new cache and network-first for app code/styles so deployments are immediately visible.
          const swPath='public/sw.js'
          let sw=fs.readFileSync(swPath,'utf8')
          sw=sw.replace("const CACHE='pandalandia-v64-shell'","const CACHE='pandalandia-v70-shell'")
          sw=sw.replace(
            " const asset=/\\.(?:js|css|png|jpg|jpeg|webp|svg|woff2?|glb|gltf|bin)$/i.test(url.pathname)\n if(asset)event.respondWith(caches.match(req).then(hit=>hit||fetch(req).then(res=>{if(res.ok){const copy=res.clone();caches.open(CACHE).then(c=>c.put(req,copy))}return res})))",
            " const appCode=/\\.(?:js|css)$/i.test(url.pathname)\n if(appCode){event.respondWith(fetch(req).then(res=>{if(res.ok){const copy=res.clone();caches.open(CACHE).then(c=>c.put(req,copy))}return res}).catch(()=>caches.match(req)));return}\n const asset=/\\.(?:png|jpg|jpeg|webp|svg|woff2?|glb|gltf|bin)$/i.test(url.pathname)\n if(asset)event.respondWith(caches.match(req).then(hit=>hit||fetch(req).then(res=>{if(res.ok){const copy=res.clone();caches.open(CACHE).then(c=>c.put(req,copy))}return res})))")
          fs.writeFileSync(swPath,sw)

          // 4) Version marker.
          const pkgPath='package.json'
          const pkg=JSON.parse(fs.readFileSync(pkgPath,'utf8'));pkg.version='70.0.0';fs.writeFileSync(pkgPath,JSON.stringify(pkg,null,2)+'\n')

          // Assertions: fail before commit if the intended architecture did not land.
          const finalPet=fs.readFileSync(petPath,'utf8'),finalCss=fs.readFileSync(cssPath,'utf8'),finalSw=fs.readFileSync(swPath,'utf8')
          for(const marker of ['HEAD_WEARABLE_IDS','anchor="head"','anchor="body"','items={items}']) if(!finalPet.includes(marker)) throw new Error('Pet marker missing: '+marker)
          for(const marker of ['V70 — screenshot-verified','-webkit-text-fill-color:#f7fbff','grid-template-columns:minmax(0,1fr)!important']) if(!finalCss.includes(marker)) throw new Error('CSS marker missing: '+marker)
          if(!finalSw.includes('pandalandia-v70-shell')||!finalSw.includes('const appCode=')) throw new Error('Service worker V70 patch missing')
          console.log('V70 source assertions OK')
          NODE
      - name: Commit final V70 source
        run: |
          git config user.name 'Pandalandia V70'
          git config user.email 'actions@users.noreply.github.com'
          git add components/world/Pet3D.tsx app/responsive-v69.css public/sw.js package.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: finalize native mobile UI and Mia wearable anchors [v70]'
          git push origin HEAD:responsive-unified-v69
